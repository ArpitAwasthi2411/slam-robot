# Robot parameters — single source of truth. Edit here, then `colcon build` (or use --symlink-install).
esp32_bridge:
  ros__parameters:
    serial_port: auto            # auto = /dev/esp32 (udev: GPIO UART ttyAMA0 or S3 USB), /dev/ttyACM* (S3), /dev/ttyUSB* (classic, skips the LiDAR)
    baud_rate: 115200
    wheel_radius: 0.0625         # 125 mm wheels
    wheel_separation: 0.30       # tune with the 360-degree spin test (docs/calibration.md)
    ticks_per_rev_left: 4963.0   # average of 2 x --push 1 m
    ticks_per_rev_right: 4977.0
    cmd_timeout: 0.5             # s, stale cmd_vel -> stop
    max_wheel_speed: 0.45        # m/s clamp sent to the ESP32
    cmd_rate: 20.0
    use_imu_yaw: true            # firmware v2.2 + MPU-6050: heading from the gyro, distance from wheels

goal_controller:
  ros__parameters:
    global_frame: map
    base_frame: base_link
    rate: 20.0
    max_linear: 0.20
    max_angular: 0.9
    min_linear: 0.04
    min_angular: 0.25
    xy_tolerance: 0.08
    yaw_tolerance: 0.08
    stop_distance: 0.38          # measured from robot centre (440 mm chassis)
    slow_distance: 0.75
    robot_half_width: 0.25         # 440 mm chassis + wheels
    front_cone_deg: 25.0
    goal_timeout: 120.0

dashboard:
  ros__parameters:
    port: 8080
    global_frame: map
    fallback_frame: odom
    max_linear: 0.20             # joystick top speed (m/s)
    max_angular: 0.40            # joystick top turn rate (rad/s): turn slower than you drive, faster turns smear the SLAM map
    scan_decimation: 3
    require_login: true          # never false when Tailscale Funnel is on (the API refuses public requests then)
    public_flag_file: ~/maps/.public_url   # setup_tailscale.sh funnel on/off writes/removes it

navigator:
  ros__parameters:
    global_frame: map
    base_frame: base_link
    rate: 20.0
    robot_radius: 0.27           # keep-out radius used by the planner (m)
    soft_radius: 0.60            # prefer this much clearance where possible (corridor centre)
    allow_unknown: false         # plan only through mapped free space
    max_linear: 0.18
    max_angular: 0.30            # rad/s: slow turns keep the map and localization steady (LiDAR scans at ~7 Hz)
    # path following feel (smooth vs. tight):
    lookahead: 0.50              # m: bigger = smoother/straighter, smaller = follows curves tighter
    k_angular: 1.0               # turning gain: lower if it weaves, higher if it's lazy
    linear_accel: 0.2            # m/s^2: smooth starts and stops
    angular_accel: 0.4           # rad/s^2: lower = gentler turn starts
    rotate_in_place_above: 1.2   # rad (~70 deg): turn on the spot above this heading error
    rotate_exit_below: 0.30      # rad (~17 deg): ...until it's below this, then drive
    stop_distance: 0.38
    slow_distance: 0.80
    robot_half_width: 0.25
    front_cone_deg: 25.0
    # The body shape (v2.4). base_link = centre of the drive axle. MEASURE these on your robot:
    #   front = axle -> front bumper, rear = axle -> back edge, half_width = centre line -> side
    # The planner checks the whole rectangle along every route, and the follower refuses a turn on
    # the spot that would swing the back into something (it does a short 3-point turn instead).
    footprint_front: 0.07
    footprint_rear: 0.37
    footprint_half_width: 0.21
    footprint_margin: 0.04       # extra keep-out (m)
    battery_cells: 3             # 3S Li-ion: 12.6 V full, ~10 V empty
    battery_low_pct: 25          # go and charge after the current task
    battery_critical_pct: 12     # go and charge now, refuse new tasks
    confirm_timeout_s: 300.0     # "wait for OK" stops continue after this
    dock_offset: 0.55            # reverse docking only: m in front of the dock where the reverse starts
    # front docking (docs/docking.md): nose-first onto the contacts, guided by the ArUco marker on the dock
    dock_direction: front        # front | reverse (the old v2.4 way)
    dock_predock_m: 0.60         # pre-dock pose: this far in front of the docked pose, facing the dock
    dock_contact_dist_m: 0.10    # base_link to the marker plane when the contacts touch (MEASURE on the dock)
    dock_creep_speed: 0.04       # m/s, capped at 0.05 (the ESP32 relaxes its front stop only <= 0.06)
    dock_tries: 3                # back off and retry this many times, then error recovery takes over
    dock_backoff_m: 0.25
    dock_volt_rise: 0.15         # V rise that counts as contact when there is no current sensor (divider only)
    dock_without_marker: false   # true = dock on the map pose alone (no camera; less precise)
    camera_x: 0.05               # camera in base_link (m): forward, left, height (MEASURE)
    camera_y: 0.0
    camera_z: 0.20
    dwell_s: 3.0                 # wait at each intermediate stop (s)
    auto_return_s: 0.0           # >0: drive home after this many idle seconds
    max_replans: 3
    pose_timeout: 1.5            # s: odometry older than this = position lost (1.0 tripped on short CPU stalls)
    llm_model: llama-3.1-8b-instant   # used only if GROQ_API_KEY is set and there is internet
    # error recovery (docs/recovery.md): when a step fails, pick one safe action from a fixed menu
    recovery_mode: llm                # llm (rules if no key / no internet) | rules | off
    recovery_llm_model: llama-3.3-70b-versatile
    recovery_max_per_mission: 4
    recovery_ask_timeout_s: 120.0     # "ask a person": the rules decide if nobody answers in the app

vision:
  ros__parameters:
    camera: auto                 # auto | libcamera (Camera Module 3 Wide) | /dev/video0 (USB webcam)
    width: 640
    height: 360                  # 16:9 keeps the wide lens' full view
    fps: 15
    hfov_deg: 102.0              # Camera Module 3 Wide: 102 deg horizontal
    flip: false                  # true if the camera is mounted upside down
    model_dir: ~/models/yolo11n_ncnn_model   # made by scripts/setup_vision.sh
    imgsz: 320
    conf: 0.45
    threads: 2                   # YOLO threads: the other cores stay free for SLAM + driving
    det_rate: 4.0                # detections per second
    stream_rate: 5.0             # app camera picture, frames per second
    jpeg_quality: 60
    path_half_angle_deg: 15.0    # a person within +-15 deg of straight ahead is "in the path"
    stop_m: 0.8                  # LiDAR distance (from the LiDAR, ~0.2 m behind the bumper): stop closer than this
    slow_m: 1.8                  # slow down closer than this (stop if they walk towards the robot)
    dock_marker: true            # look for the dock marker (/vision/dock_marker, ~10 Hz)
    marker_dict: DICT_4X4_50
    marker_id: 0
    marker_size_m: 0.08          # black square side, without the white border
    marker_rate: 10.0
    camera_calib: ''             # '' = built-in Camera Module 3 Wide defaults; or the path of a measured YAML
