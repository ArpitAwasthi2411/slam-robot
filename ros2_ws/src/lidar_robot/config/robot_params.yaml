# Robot parameters — single source of truth. Edit here, then `colcon build` (or use --symlink-install).
esp32_bridge:
  ros__parameters:
    serial_port: auto            # auto = /dev/esp32 (udev: GPIO UART ttyAMA0 or S3 USB), /dev/ttyACM* (S3), /dev/ttyUSB* (classic, skips the LiDAR)
    baud_rate: 115200
    wheel_radius: 0.0625         # 125 mm wheels
    wheel_separation: 0.294      # 2 Nov 2026 lab: app spin test (was 0.30); re-check with docs/calibration.md
    ticks_per_rev_left: 5048.0   # 31 Oct 2026 lab: 5 m drive, wheels said 4.669 m vs 4.590 m taped (was 4963/4977)
    ticks_per_rev_right: 5063.0
    cmd_timeout: 0.5             # s, stale cmd_vel -> stop
    max_wheel_speed: 0.45        # m/s clamp sent to the ESP32
    cmd_rate: 20.0
    use_imu_yaw: true            # firmware v2.2 + MPU-6050: heading from the gyro, distance from wheels
    gyro_scale: 1.043              # app Spin test with the gyro working: set what it suggests (docs/mapping.md)

goal_controller:
  ros__parameters:
    global_frame: map
    base_frame: base_link
    rate: 20.0
    max_linear: 0.30             # m/s; 0.22 until 20 Nov
    max_angular: 0.9
    min_linear: 0.04
    min_angular: 0.25
    xy_tolerance: 0.08
    yaw_tolerance: 0.08
    stop_distance: 0.38          # measured from robot centre (440 mm chassis)
    slow_distance: 0.75
    robot_half_width: 0.25         # 460 mm square body (0.23) + 2 cm
    front_cone_deg: 25.0
    goal_timeout: 120.0

dashboard:
  ros__parameters:
    port: 8080
    global_frame: map
    fallback_frame: odom
    max_linear: 0.30             # joystick top speed (m/s): Drive slider 60 % = 0.18 m/s; 0.22 until 20 Nov
    max_angular: 0.40            # joystick top turn rate (rad/s): turn slower than you drive, faster turns smear the SLAM map
    scan_decimation: 3
    require_login: true          # never false when Tailscale Funnel is on (the API refuses public requests then)
    public_flag_file: ~/maps/.public_url   # setup_tailscale.sh funnel on/off writes/removes it
    map_autosave_s: 180.0        # while mapping: save the live map every 3 min (+ at once when the Pi is hot) as
                                 # ~/maps/autosave_<start time>; Map tab -> Continue mapping on it after a crash. 0 = off

navigator:
  ros__parameters:
    global_frame: map
    base_frame: base_link
    rate: 20.0
    robot_radius: 0.30           # keep-out radius used by the planner (m): half the 46 cm body + 7 cm
    soft_radius: 1.00            # prefer this much clearance where possible: routes run down the middle of
                                 # corridors up to 2 m wide, away from flower pots along the walls (0.60 until 20 Nov)
    soft_weight: 10.0            # how strongly (6 until 20 Nov)
    allow_unknown: false         # plan only through mapped free space
    max_linear: 0.25             # m/s on trips; 0.20 until 20 Nov (App Tuning -> Cruise speed to change)
    max_angular: 0.30            # rad/s: slow turns keep the map and localization steady (LiDAR scans at ~7 Hz)
    # path following feel (smooth vs. tight):
    lookahead: 0.50              # m: bigger = smoother/straighter, smaller = follows curves tighter
    k_angular: 0.6               # turning gain: lower if it weaves, higher if it is lazy (1.0 until 20 Nov: steering never needs to be fast)
    linear_accel: 0.2            # m/s^2: smooth starts and stops
    angular_accel: 0.4           # rad/s^2: lower = gentler turn starts
    rotate_in_place_above: 1.2   # rad (~70 deg): turn on the spot above this heading error
    rotate_exit_below: 0.30      # rad (~17 deg): ...until it's below this, then drive
    stop_distance: 0.38
    slow_distance: 0.80
    blocked_after: 2.5           # s stopped by an obstacle before planning a route around it (5.0 until 20 Nov: too slow)
    us_memory_s: 25.0            # s an obstacle seen only by the ultrasonics stays on the plan (LiDAR can't see low boxes); 60 until 23 Nov
    backup_m: 0.25               # after an object stops the robot: back up this far (only if the LiDAR sees the
                                 # rear clear) so it has room to turn and go round the side; 0 = off
    us_wall_tol: 0.12            # m: ultrasonic echoes this close to a mapped wall (door frames) never stop or block the robot
    robot_half_width: 0.25         # LiDAR stop zone: body + 2 cm (door handles beside the path)
    front_cone_deg: 25.0
    # The body shape (v2.4). base_link = centre of the drive axle. MEASURE these on your robot:
    #   front = axle -> front bumper, rear = axle -> back edge, half_width = centre line -> side
    # The planner checks the whole rectangle along every route, and the follower refuses a turn on
    # the spot that would swing the back into something (it does a short 3-point turn instead).
    footprint_front: 0.07
    footprint_rear: 0.39         # 46 x 46 cm square body; axle 7 cm from the front assumed: MEASURE
    footprint_half_width: 0.23
    footprint_margin: 0.04       # extra keep-out (m)
    battery_cells: 3             # 3S Li-ion: 12.6 V full, ~10 V empty
    battery_low_pct: 25          # go and charge after the current task
    battery_critical_pct: 12     # go and charge now, refuse new tasks
    confirm_timeout_s: 300.0     # "wait for OK" stops continue after this
    dock_offset: 0.55            # reverse docking only: m in front of the dock where the reverse starts
    # front docking (docs/docking.md): nose-first onto the contacts, guided by the ArUco marker on the dock
    dock_direction: front        # front | reverse (the old v2.4 way)
    dock_predock_m: 0.60         # pre-dock pose: this far in front of the docked pose, facing the dock
    dock_contact_dist_m: 0.10    # base_link to the marker plane when the contacts touch (MEASURE on the dock)
    dock_creep_speed: 0.04       # m/s, capped at 0.05 (the ESP32 relaxes its front stop only <= 0.06)
    dock_tries: 3                # back off and retry this many times, then error recovery takes over
    dock_backoff_m: 0.25
    dock_volt_rise: 0.15         # V rise that counts as contact when there is no current sensor (divider only)
    dock_without_marker: false   # true = dock on the map pose alone (no camera; less precise)
    camera_x: 0.05               # camera in base_link (m): forward, left, height (MEASURE)
    camera_y: 0.0
    camera_z: 0.20
    dwell_s: 3.0                 # wait at each intermediate stop (s)
    auto_return_s: 0.0           # >0: drive home after this many idle seconds
    # voice button ON the robot (no login): anywhere it can stop the robot, give the OK at a "wait for OK"
    # stop and answer questions; trips only start from the home spot / dock, at normal priority
    button_enabled: true         # admins can also switch it off in the app (Operate)
    button_home_radius: 0.6      # m from Home or the dock that counts as "at home"
    button_gap_s: 30.0           # at most one voice trip from the button per this many seconds
    # network lost: accepted trips are finished, then the robot waits at home (where the button works)
    offline_home_s: 120.0        # s without network and nothing to do -> go home (0 = never)
    network_check_s: 10.0        # how often the Wi-Fi/hotspot gateway is pinged
    max_replans: 3
    max_manoeuvres: 6            # narrow places: forward/back/turn shuffles per route when the body can't turn (2 until 23 Nov)
    pose_timeout: 1.5            # s: odometry older than this = position lost (1.0 tripped on short CPU stalls)
    llm_model: openai/gpt-oss-20b     # used only if GROQ_API_KEY is set and there is internet (Groq retired llama-3.x on 16 Aug 2026)
    llm_policy: smart                 # smart: offline rules first, LLM only when they are unsure | always | off
    polite_pass: true                 # blocked by a person: "may I pass?" and wait; by an object: new route at once
    person_wait_s: 5.0                # how long a person gets to step aside (8 until 20 Nov), then a route round them
    object_wait_s: 1.2                # no person in the camera for this long = an object
    pass_text: "Excuse me, may I pass?"   # e.g. "Kripya raasta dijiye"
    nav_backend: pathik               # set by the launch: nav_mode:=nav2 makes Nav2 plan and drive (docs/nav2.md)
    nav2_mode: navigate               # navigate = Nav2 planner + controller | follow = Pathik's route, Nav2's controller
    chat_enabled: true                # talk to the robot: college notebook (app: Operate -> Knowledge) + general questions
    chat_model: openai/gpt-oss-120b   # conversation model (falls back to the small one if Groq retires it)
    llm_timeout: 6.0
    # error recovery (docs/recovery.md): when a step fails, pick one safe action from a fixed menu
    recovery_mode: llm                # llm (rules if no key / no internet) | rules | off
    recovery_llm_model: openai/gpt-oss-120b
    recovery_max_per_mission: 4
    recovery_ask_timeout_s: 30.0      # "ask a person": the rules decide if nobody answers in the app (120 until 23 Nov)
    # robot voice (docs/STEPS_voice.md): Piper offline TTS (scripts/setup_voice.sh), espeak-ng as fallback
    speech: true
    speech_engine: auto               # auto | piper | espeak
    speech_volume: 1.0                # 0 .. 1.5
    speech_rate: 1.15                 # speaking speed: 1.0 = the voice's own, 1.15 = 15 % slower (clearer), max 2.0
    speech_pause_s: 0.3               # pause between sentences (s)
    speech_voice_en: ''               # '' = first ~/piper/voices/en_*.onnx
    speech_voice_hi: hi_IN-priyamvada-medium   # Hindi voice: hi_IN-priyamvada-medium (female) / hi_IN-pratham-medium (male)
                                      # (chat answers use matching Hindi verb forms: ja rahi / ja raha hoon)
    speech_one_voice: ''              # '' = English voice for English, Hindi voice for Devanagari (18 Nov: both Hindi
                                      # voices read English badly). hi = the Hindi voice reads everything
    speech_max_per_min: 8             # announcements per minute (questions / battery always get through)
    speech_device: plughw:CARD=Device,DEV=0   # the robot's USB sound card (17 Nov); '' = ALSA default

vision:
  ros__parameters:
    camera: auto                 # auto | libcamera (Camera Module 3 Wide) | /dev/video0 (USB webcam)
    width: 640
    height: 360                  # 16:9 keeps the wide lens' full view
    fps: 15                      # sensor rate: short exposures keep walking people sharp
    out_fps: 5                   # frames/s handed to Python (GStreamer drops the rest): >= det_rate and stream_rate
    hfov_deg: 102.0              # Camera Module 3 Wide: 102 deg horizontal
    flip: false                  # true if the camera is mounted upside down
    model_dir: ~/models/yolo11n_ncnn_model   # made by scripts/setup_vision.sh
    imgsz: 320
    conf: 0.45
    track_conf: 0.25             # boxes down to this only CONTINUE a tracked person (half hidden)
    threads: 1                   # YOLO threads: a Pi 4 needs the other 3 cores for SLAM + driving
    det_rate: 2.0                # detections per second (175 ms each on a Pi 4)
    stream_rate: 5.0             # app camera picture, frames per second (only while the camera view is open)
    jpeg_quality: 60
    path_half_angle_deg: 15.0    # a person within +-15 deg of straight ahead is "in the path"
    stop_m: 0.8                  # LiDAR distance (from the LiDAR, ~0.2 m behind the bumper): stop closer than this
    slow_m: 1.8                  # slow down closer than this (stop if they walk towards the robot)
    dock_marker: true            # look for the dock marker (/vision/dock_marker, ~10 Hz)
    marker_dict: DICT_4X4_50
    marker_id: 0
    marker_size_m: 0.0725        # black square side, without the white border (18 Nov print measured 72.5 mm)
    marker_rate: 10.0            # only while docking (navigator asks); capped at out_fps
    marker_always: false         # true = look for the marker all the time (bench test with marker_webcam)
    phone_timeout: 1.0           # s: the phone in the head stopped sending people boxes -> the Pi's own YOLO again
    idle_pause_s: 30.0           # people detection pauses this long after the robot stopped being busy (0 = never)
    camera_calib: ''             # '' = built-in Camera Module 3 Wide defaults; or the path of a measured YAML

voice:
  ros__parameters:
    button_gpio: 17              # BCM: header pin 11, button to GND (pin 9). NOT 14/15 (ESP32 UART)
    button_chip: gpiochip0
    mic_device: plughw:CARD=Device,DEV=0   # the robot's USB sound card (17 Nov; see arecord -L); '' = ALSA default
    speaker_device: ''           # for the "listening" beep
    max_record_s: 8.0
    stt_model: whisper-large-v3-turbo   # Groq Whisper (GROQ_API_KEY)
    stt_language: ''             # '' = auto (English / Hindi / Hinglish), or en / hi
    vosk_en: ~/models/vosk/en    # offline fallback, made by scripts/setup_voice.sh
    vosk_hi: ~/models/vosk/hi
    beep: true

