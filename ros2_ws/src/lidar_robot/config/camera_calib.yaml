# Camera calibration for the dock marker (lidar_robot/marker_pose.py). Camera Module 3 Wide.
# These are APPROXIMATE defaults for a 640x480 (4:3) mode; replace them with measured values
# (docs/docking.md, "Calibrate the camera"). The vision node captures 640x360 (16:9): a different crop of
# the sensor, so for that size the built-in 16:9 defaults are used unless you calibrate at 640x360 and put
# width: 640 / height: 360 here.
width: 640
height: 480
camera_matrix:
  - [346.0, 0.0, 320.0]
  - [0.0, 346.0, 240.0]
  - [0.0, 0.0, 1.0]
dist_coeffs: [-0.05, 0.01, 0.0, 0.0, 0.0]   # k1, k2, p1, p2, k3 (OpenCV order)
